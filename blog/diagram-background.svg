<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#555"/>
    </marker>
  </defs>

  <!-- source boxes -->
  <rect x="20" y="30" width="230" height="84" rx="10" fill="#ffffff" stroke="#444" stroke-width="1.5"/>
  <text x="135" y="58" text-anchor="middle" font-size="16" fill="#111">systemd</text>
  <text x="135" y="80" text-anchor="middle" font-size="12.5" font-family="ui-monospace, Menlo, monospace" fill="#555">UnitNew / UnitRemoved</text>
  <text x="135" y="99" text-anchor="middle" font-size="12.5" font-family="ui-monospace, Menlo, monospace" fill="#555">app scopes</text>

  <rect x="20" y="150" width="230" height="84" rx="10" fill="#ffffff" stroke="#444" stroke-width="1.5"/>
  <text x="135" y="178" text-anchor="middle" font-size="16" fill="#111">Wayland</text>
  <text x="135" y="200" text-anchor="middle" font-size="12.5" font-family="ui-monospace, Menlo, monospace" fill="#555">ext-foreign-toplevel</text>
  <text x="135" y="219" text-anchor="middle" font-size="12.5" font-family="ui-monospace, Menlo, monospace" fill="#555">visible windows</text>

  <!-- merge box -->
  <rect x="330" y="86" width="170" height="88" rx="10" fill="#f4f6fb" stroke="#3b63d8" stroke-width="1.5"/>
  <text x="415" y="120" text-anchor="middle" font-size="16" fill="#111">merge</text>
  <text x="415" y="143" text-anchor="middle" font-size="12.5" fill="#555">maximum state wins</text>

  <!-- arrows into merge -->
  <path d="M 250 72 C 290 72, 290 108, 328 116" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 250 192 C 290 192, 290 156, 328 148" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- output -->
  <path d="M 500 130 L 556 130" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="560" y="86" width="145" height="88" rx="10" fill="#ffffff" stroke="#444" stroke-width="1.5"/>
  <text x="632" y="118" text-anchor="middle" font-size="15" fill="#111">portal state</text>
  <text x="632" y="140" text-anchor="middle" font-size="12" fill="#555">Background / Running</text>
  <text x="632" y="158" text-anchor="middle" font-size="11.5" font-style="italic" fill="#888">never Active</text>
</svg>
